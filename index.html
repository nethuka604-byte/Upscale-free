<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelEnhance AI - Image Upscaler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-light { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(0, 0, 0, 0.08); }
        .drag-active { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.15) !important; scale: 1.02; }
        /* Disable text selection */
        body { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 bg-slate-950 text-slate-100 transition-colors duration-300" id="bodyTheme">

    <!-- Navbar -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center py-4 px-6 glass rounded-2xl mt-2 transition-all" id="navGlass">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-wand-magic-sparkles text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">PixelEnhance AI</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-800 text-amber-400 hover:bg-slate-700 transition" id="themeBtn">
                <i class="fa-solid fa-sun" id="themeIcon"></i>
            </button>
            <span class="text-xs px-3 py-1.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-medium">v3.0 Pro</span>
        </div>
    </header>

    <!-- Main UI -->
    <main class="max-w-lg mx-auto w-full my-auto py-8">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center space-y-6 transition-all" id="mainGlass">
            <div>
                <h2 class="text-2xl font-bold mb-2">AI Image Quality Increaser</h2>
                <p class="text-gray-400 text-sm" id="subText">Enhance details & upscale images up to 4x resolution</p>
            </div>

            <!-- Drag & Drop Upload Area -->
            <div id="dropzone" onclick="document.getElementById('fileInput').click()" 
                 class="border-2 border-dashed border-slate-700 hover:border-blue-500 transition-all duration-200 cursor-pointer p-8 rounded-2xl flex flex-col items-center justify-center bg-slate-900/40 hover:bg-slate-800/60">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-500 mb-3 pointer-events-none"></i>
                <p class="text-sm font-medium pointer-events-none" id="fileName">Click or Drag & Drop image here</p>
                <p class="text-xs text-gray-500 mt-1 pointer-events-none">PNG, JPG, WEBP formats</p>
                <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="handleFileSelect(event)">
            </div>

            <button id="enhanceBtn" onclick="processImage()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl font-semibold shadow-lg shadow-blue-500/25 transition">
                Enhance Photo Now
            </button>

            <div id="status" class="hidden text-sm font-medium text-blue-400 animate-pulse"></div>

            <!-- Result Area -->
            <div id="resultContainer" class="hidden space-y-4">
                <div class="relative rounded-xl overflow-hidden border border-slate-700 bg-black/40 select-none" id="sliderContainer">
                    <img id="afterImg" class="w-full h-auto block" alt="Enhanced Result">
                    <div id="beforeWrapper" class="absolute top-0 left-0 h-full overflow-hidden w-1/2 border-r-2 border-white shadow-2xl">
                        <img id="beforeImg" class="h-full max-w-none" alt="Original Image">
                    </div>
                    <input type="range" min="0" max="100" value="50" id="slider" oninput="moveSlider(this.value)" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-ew-resize">
                    <span class="absolute bottom-2 left-2 text-[10px] bg-black/60 px-2 py-0.5 rounded text-white pointer-events-none">Original</span>
                    <span class="absolute bottom-2 right-2 text-[10px] bg-blue-600/80 px-2 py-0.5 rounded text-white pointer-events-none">Enhanced</span>
                </div>
                <canvas id="upscaleCanvas" class="hidden"></canvas>

                <div class="flex gap-2">
                    <button onclick="downloadWithAd()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-semibold transition text-center text-white cursor-pointer">
                        <i class="fa-solid fa-download mr-1"></i> Download
                    </button>
                    <button onclick="resetApp()" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-semibold transition text-slate-300">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Reset
                    </button>
                </div>

                <div class="flex items-center justify-between bg-slate-900/50 p-3 rounded-xl border border-slate-800 mt-3">
                    <span class="text-xs text-gray-400">How is the quality?</span>
                    <div class="flex gap-2">
                        <button onclick="sendFeedback('like')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-emerald-500/20 hover:text-emerald-400 text-gray-300 transition text-sm flex items-center gap-1">
                            <i class="fa-solid fa-thumbs-up"></i>
                        </button>
                        <button onclick="sendFeedback('dislike')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 text-gray-300 transition text-sm flex items-center gap-1">
                            <i class="fa-solid fa-thumbs-down"></i>
                        </button>
                    </div>
                </div>

                <!-- Adsterra 300x250 Banner -->
                <div class="flex justify-center my-4 overflow-hidden rounded-xl">
                    <script>
                      atOptions = {
                        'key' : 'd2223fa64e7d6e0317695066b8f2e9a7',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                      };
                    </script>
                    <script src="https://www.highrevenueformat.com/d2223fa64e7d6e0317695066b8f2e9a7/invoke.js"></script>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center text-xs text-gray-500 py-4">
        Powered by Client-Side Super Resolution Engine
    </footer>

    <!-- Anti-Copy Protection Script -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function (e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
    </script>

    <!-- Embedded JavaScript Code -->
    <script>
        let selectedFile = null;
        let originalImgUrl = null;

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('fileName').innerText = file.name;
                originalImgUrl = URL.createObjectURL(file);
            }
        }

        // Drag & Drop
        const dropzone = document.getElementById('dropzone');
        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.add('drag-active'); }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => { e.preventDefault(); dropzone.classList.remove('drag-active'); }, false);
        });
        dropzone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('fileInput').files = files;
                handleFileSelect({ target: { files: files } });
            }
        });

        function processImage() {
            if (!selectedFile) {
                alert("Please select an image first!");
                return;
            }

            const status = document.getElementById('status');
            const resultContainer = document.getElementById('resultContainer');
            const afterImg = document.getElementById('afterImg');
            const beforeImg = document.getElementById('beforeImg');
            const canvas = document.getElementById('upscaleCanvas');
            const ctx = canvas.getContext('2d');

            status.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            status.innerText = "Enhancing resolution and details (4x)...";

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    try {
                        let maxDim = 2000;
                        let w = img.width;
                        let h = img.height;
                        
                        if (w > maxDim || h > maxDim) {
                            let ratio = Math.min(maxDim / w, maxDim / h);
                            w = Math.floor(w * ratio);
                            h = Math.floor(h * ratio);
                        }

                        const targetWidth = w * 2;
                        const targetHeight = h * 2;

                        canvas.width = targetWidth;
                        canvas.height = targetHeight;

                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                        const enhancedUrl = canvas.toDataURL('image/png', 0.9);
                        
                        afterImg.src = enhancedUrl;
                        beforeImg.src = originalImgUrl;

                        afterImg.onload = () => {
                            beforeImg.style.width = `${afterImg.clientWidth}px`;
                            beforeImg.style.height = `${afterImg.clientHeight}px`;
                        };

                        status.classList.add('hidden');
                        resultContainer.classList.remove('hidden');
                        moveSlider(50);
                    } catch (err) {
                        status.classList.add('hidden');
                        alert("Processing error: " + err.message);
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(selectedFile);
        }

        // Smart Link Download Function[span_2](start_span)[span_2](end_span)
        function downloadWithAd() {
            const smartLinkUrl = "https://www.profitableratecpmnetwork.com/kpgnae8ytq?key=5bb33568847dd4a02d217d67fe9897bc";[span_3](start_span)[span_3](end_span)

            window.open(smartLinkUrl, '_blank');[span_4](start_span)[span_4](end_span)

            const canvas = document.getElementById('upscaleCanvas');
            if (canvas) {
                const imageURL = canvas.toDataURL('image/png', 1.0);
                const link = document.createElement('a');
                link.href = imageURL;
                link.download = 'enhanced-4x.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function moveSlider(val) {
            const beforeWrapper = document.getElementById('beforeWrapper');
            beforeWrapper.style.width = `${val}%`;
        }

        function resetApp() {
            selectedFile = null;
            originalImgUrl = null;
            document.getElementById('fileInput').value = "";
            document.getElementById('fileName').innerText = "Click or Drag & Drop image here";
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('status').classList.add('hidden');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const body = document.getElementById('bodyTheme');
            const icon = document.getElementById('themeIcon');
            const navGlass = document.getElementById('navGlass');
            const mainGlass = document.getElementById('mainGlass');
            const subText = document.getElementById('subText');

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                body.className = "min-h-screen flex flex-col justify-between p-4 bg-slate-100 text-slate-800 transition-colors duration-300";
                navGlass.className = "max-w-4xl mx-auto w-full flex justify-between items-center py-4 px-6 glass-light rounded-2xl mt-2 transition-all";
                mainGlass.className = "glass-light p-8 rounded-3xl shadow-2xl text-center space-y-6 transition-all";
                subText.className = "text-gray-600 text-sm";
                icon.className = "fa-solid fa-moon text-indigo-600";
            } else {
                html.classList.add('dark');
                body.className = "min-h-screen flex flex-col justify-between p-4 bg-slate-950 text-slate-100 transition-colors duration-300";
                navGlass.className = "max-w-4xl mx-auto w-full flex justify-between items-center py-4 px-6 glass rounded-2xl mt-2 transition-all";
                mainGlass.className = "glass p-8 rounded-3xl shadow-2xl text-center space-y-6 transition-all";
                subText.className = "text-gray-400 text-sm";
                icon.className = "fa-solid fa-sun text-amber-400";
            }
        }

        function sendFeedback(type) {
            if (type === 'like') {
                alert("Thanks for your feedback! 👍");
            } else {
                alert("Thanks! We'll work on improving the quality. 👎");
            }
        }
    </script>
</body>
</html>
